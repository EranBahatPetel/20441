<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>strictlyIncreasing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .instructions {
            color: #555;
            margin-bottom: 25px;
            font-size: 1.1rem;
            background: #eef2f5;
            padding: 10px 20px;
            border-radius: 5px;
            border-right: 5px solid #3498db;
        }

        /* עיצוב מיכל המערך - הגדרה מוחלטת משמאל לימין */
        .array-container {
            display: flex;
            flex-direction: row; 
            direction: ltr; /* מבטיח שאינדקס 0 יהיה בשמאל הקיצוני */
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .array-cell {
            width: 45px;
            height: 45px;
            border: 2px solid #bdc3c7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            background-color: #fff;
            transition: all 0.2s ease;
            position: relative;
            margin: 0 2px;
        }

        /* תצוגת אינדקסים מעל התאים */
        .array-cell::before {
            content: attr(data-index);
            position: absolute;
            top: -22px;
            font-size: 0.8rem;
            color: #7f8c8d;
            font-weight: normal;
        }

        .array-cell.current {
            border-color: #e67e22;
            box-shadow: 0 0 10px #e67e22;
            transform: scale(1.05);
            z-index: 2;
        }

        .array-cell.next {
            border-color: #3498db;
        }

        .array-cell.increasing {
            background-color: #2ecc71 !important;
            color: white;
            border-color: #27ae60;
        }

        /* חץ המצביע של i */
        .pointer {
            position: absolute;
            bottom: -25px;
            font-size: 1.2rem;
            color: #e67e22;
            transition: left 0.2s ease;
            transform: translateX(-50%);
            direction: ltr;
        }

        .stats-panel {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 320px;
            margin-top: 25px;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .stat-value {
            font-weight: bold;
            color: #2c3e50;
        }

        .controls {
            margin-top: 25px;
        }

        button {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2c3e50;
        }

        .message {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            height: 30px;
            color: #27ae60;
        }
    </style>
</head>
<body>

    <h1>strictlyIncreasing</h1>
    <div class="instructions">לחץ על מקש <strong>Enter ↵</strong> במקלדת כדי להתקדם צעד קדימה.</div>

    <div style="position: relative; margin-top: 30px;">
        <div class="array-container" id="arrayContainer"></div>
        <div class="pointer" id="pointer">⬆️ i</div>
    </div>

    <div class="stats-panel">
        <div class="stat-line">
            <span>אורך רצף נוכחי (מספר תאים):</span>
            <span class="stat-value" id="currentLengthVal">0</span>
        </div>
        <div class="stat-line">
            <span>מספר תתי-מערכים עולים (totalNum):</span>
            <span class="stat-value" id="totalNumVal">0</span>
        </div>
    </div>

    <div class="controls">
        <button onclick="restartAlgorithm()">התחל מחדש</button>
    </div>

    <div class="message" id="statusMessage"></div>

    <script>
        const arraySize = 20;
        let arrayData = [];
        
        function generateArrayWithGuaranteedSequence() {
            let arr = [];
            for (let i = 0; i < arraySize; i++) {
                arr.push(Math.floor(Math.random() * 20) + 1);
            }
            
            const startIndex = Math.floor(Math.random() * (arraySize - 4));
            
            let sequence = [];
            while(sequence.length < 5) {
                let num = Math.floor(Math.random() * 20) + 1;
                if(!sequence.includes(num)) {
                    sequence.push(num);
                }
            }
            sequence.sort((a, b) => a - b);
            
            for (let i = 0; i < 5; i++) {
                arr[startIndex + i] = sequence[i];
            }
            
            return arr;
        }

        arrayData = generateArrayWithGuaranteedSequence();

        let currentIndex = 0;
        let currentSequenceLength = 0; 
        let totalNum = 0;
        let isFinished = false;

        function renderArray() {
            const container = document.getElementById('arrayContainer');
            container.innerHTML = '';
            arrayData.forEach((val, idx) => {
                const cell = document.createElement('div');
                cell.className = 'array-cell';
                cell.innerText = val;
                cell.setAttribute('data-index', idx);
                cell.id = `cell-${idx}`;
                container.appendChild(cell);
            });
        }

        function updatePointer(idx) {
            const pointer = document.getElementById('pointer');
            if (idx < arraySize - 1) {
                const currentCell = document.getElementById(`cell-${idx}`);
                // חישוב המיקום משמאל לימין עובד כעת באופן מדויק
                const offsetLeft = currentCell.offsetLeft + (currentCell.offsetWidth / 2);
                pointer.style.left = `${offsetLeft}px`;
                pointer.style.display = 'block';
            } else {
                pointer.style.display = 'none';
            }
        }

        function algorithmStep() {
            if (isFinished) return;

            if (currentIndex >= arraySize - 1) {
                isFinished = true;
                updatePointer(currentIndex);
                document.querySelectorAll('.array-cell').forEach(c => c.classList.remove('current', 'next'));
                document.getElementById('statusMessage').innerText = `הריצה הסתיימה! סה"כ תתי מערכים עולים: ${totalNum}`;
                return;
            }

            document.querySelectorAll('.array-cell').forEach(c => c.classList.remove('current', 'next'));

            const cellCurrent = document.getElementById(`cell-${currentIndex}`);
            const cellNext = document.getElementById(`cell-${currentIndex + 1}`);
            
            cellCurrent.classList.add('current');
            cellNext.classList.add('next');
            updatePointer(currentIndex);

            if (arrayData[currentIndex] < arrayData[currentIndex + 1]) {
                currentSequenceLength++;
                totalNum += currentSequenceLength;

                document.querySelectorAll('.array-cell').forEach(c => c.classList.remove('increasing'));
                
                const startOfSequence = (currentIndex + 1) - currentSequenceLength;
                for (let k = startOfSequence; k <= currentIndex + 1; k++) {
                    document.getElementById(`cell-${k}`).classList.add('increasing');
                }

                document.getElementById('currentLengthVal').innerText = currentSequenceLength + 1;
            } else {
                currentSequenceLength = 0;
                document.querySelectorAll('.array-cell').forEach(c => c.classList.remove('increasing'));
                document.getElementById('currentLengthVal').innerText = 0;
            }

            document.getElementById('totalNumVal').innerText = totalNum;
            currentIndex++;
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                algorithmStep();
            }
        });

        function restartAlgorithm() {
            currentIndex = 0;
            currentSequenceLength = 0;
            totalNum = 0;
            isFinished = false;

            document.getElementById('currentLengthVal').innerText = '0';
            document.getElementById('totalNumVal').innerText = '0';
            document.getElementById('statusMessage').innerText = 'לחץ Enter כדי להתחיל לצעוד...';

            renderArray();
            updatePointer(0);
            
            document.activeElement.blur();
        }

        renderArray();
        restartAlgorithm();
    </script>
</body>
</html>
