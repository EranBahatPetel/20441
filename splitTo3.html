<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>הדמיית אלגוריתם SplitTo3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 20px;
            color: #333;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
            background: #eef2f7;
            padding: 15px;
            border-radius: 6px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        .status-panel {
            display: flex;
            gap: 30px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            background: #fdfefe;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
        }
        .number-display {
            direction: ltr;
            display: inline-block;
        }
        .pointer-labels {
            display: flex;
            position: relative;
            height: 25px;
            margin-top: 15px;
        }
        .pointer-label {
            position: absolute;
            transform: translateX(-50%);
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .limit1-label { color: #c0392b; }
        .limit2-label { color: #27ae60; }
        
        .array-container {
            display: flex;
            direction: ltr; 
            margin-bottom: 25px;
            border: 2px solid #ccc;
            border-radius: 4px;
            overflow: hidden;
            background: #fff;
        }
        .array-cell {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-size: 16px;
            font-weight: bold;
            border-right: 1px solid #ddd;
            position: relative;
            transition: background-color 0.3s;
        }
        .array-cell:last-child {
            border-right: none;
        }
        
        /* מחלקות צביעה */
        .bg-red { background-color: #fdad9e !important; }    /* 0 עד limit1 */
        .bg-yellow { background-color: #fff2cc !important; } /* limit1+1 עד limit2 */
        .bg-green { background-color: #abebc6 !important; }  /* limit2+1 עד הסוף */
        
        .log-box {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
            height: 80px;
            overflow-y: auto;
            font-size: 15px;
        }
        .result-box {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .result-true { background-color: #d4edda; color: #155724; }
        .result-false { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h1>הדמיית אלגוריתם SplitTo3</h1>
    <p>התקדמו עם מקש <strong>Enter</strong>.</p>
    
    <div class="controls">
        <label for="scenario-select"><strong>בחר תרחיש:</strong></label>
        <select id="scenario-select" style="padding: 5px; font-size: 16px;">
            <option value="true">דוגמה 1: תוצאה חיובית (True)</option>
            <option value="false">דוגמה 2: תוצאה שלילית (False)</option>
        </select>
        <button id="btn-rerun" style="background-color: #e67e22;">הרץ מחדש על המערך הנוכחי</button>
        <button id="btn-reset">הגרל ואפס מערך חדש</button>
        <button id="btn-step" style="background-color: #27ae60;">צעד הבא (Enter)</button>
    </div>

    <div class="pointer-labels" id="pointers-row" style="direction: ltr;"></div>

    <div class="array-container" id="array-row"></div>

    <div class="status-panel">
        <div>סכום הטווח האמצעי (sum מ-limit1+1 עד limit2): <span id="val-sum" class="number-display" style="color: #2980b9;">0</span></div>
        <div>שלב נוכחי: <span id="val-phase" style="color: #7f8c8d;">אתחול</span></div>
    </div>

    <div class="log-box" id="log-stream">טוען נתונים...</div>

    <div class="result-box" id="result-display"></div>
</div>

<script>
let currentArr = [];
let limit1 = -1; 
let limit2 = 0;
let sum = 0;
let phase = "init"; 
let forIndex = 0;
let isFinished = false;

let generatedTrueArray = [];
let generatedFalseArray = [];

function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateBaseRandomArray() {
    let arr = [];
    let currentVal = getRandomInt(-110, -85);
    for (let i = 0; i < 10; i++) {
        arr.push(currentVal);
        currentVal += getRandomInt(5, 10);
    }
    if (arr[9] >= 0) { 
        let diff = arr[9] + getRandomInt(2, 5);
        arr = arr.map(x => x - diff);
    }
    
    currentVal = getRandomInt(3, 9);
    for (let i = 0; i < 10; i++) {
        arr.push(currentVal);
        currentVal += getRandomInt(5, 10);
    }
    return arr;
}

function checkIfArrayHasSolution(arr) {
    let s = 0;
    for(let i = 0; i < arr.length; i++) s += arr[i]; 
    let l1 = -1, l2 = arr.length - 1;
    while(l1 < l2 - 1) { 
        if(s === 0) return true;
        if(s < 0) { l1++; s -= arr[l1]; }
        else { s -= arr[l2]; l2--; }
    }
    return s === 0;
}

function generateScenarios() {
    // ---- 1. ייצור מערך TRUE עם פרוסה אמיתית מלאה באיברים שמתאפסת ----
    let arrT = [];
    let ready = false;
    
    while (!ready) {
        arrT = generateBaseRandomArray();
        
        let s = 0;
        for(let i = 0; i < arrT.length; i++) s += arrT[i]; 
        let l1 = -1, l2 = arrT.length - 1;
        
        let path = [];
        while(l1 < l2 - 1) {
            path.push({l1: l1, l2: l2, currentSum: s});
            if(s === 0) break;
            if(s < 0) { l1++; s -= arrT[l1]; }
            else { s -= arrT[l2]; l2--; }
        }
        
        if (s === 0 && (l2 - l1 > 1)) {
            generatedTrueArray = arrT;
            ready = true;
            break;
        }
        
        let validStates = path.filter(state => (state.l2 - state.l1) >= 4);
        if (validStates.length > 0) {
            let targetState = validStates[getRandomInt(0, validStates.length - 1)];
            let neededDiff = targetState.currentSum;
            
            let targetCellIndex = Math.floor((targetState.l1 + 1 + targetState.l2) / 2);
            arrT[targetCellIndex] -= neededDiff;
            
            for (let i = 1; i < 20; i++) {
                if (arrT[i] <= arrT[i-1]) arrT[i] = arrT[i-1] + getRandomInt(2, 5);
            }
            for (let i = 0; i < 20; i++) {
                if (arrT[i] === 0) arrT[i] = (i < 10) ? -1 : 1;
            }
            arrT.sort((a, b) => a - b);
            
            if (checkIfArrayHasSolution(arrT)) {
                generatedTrueArray = arrT;
                ready = true;
            }
        }
    }

    // ---- 2. ייצור מערך FALSE ----
    let arrF = [];
    let attempts = 0;
    do {
        arrF = generateBaseRandomArray();
        attempts++;
    } while (checkIfArrayHasSolution(arrF) && attempts < 500);
    
    generatedFalseArray = arrF;
}

const arrayRow = document.getElementById("array-row");
const pointersRow = document.getElementById("pointers-row");
const valSum = document.getElementById("val-sum");
const valPhase = document.getElementById("val-phase");
const logStream = document.getElementById("log-stream");
const resultDisplay = document.getElementById("result-display");
const scenarioSelect = document.getElementById("scenario-select");

function initSimulation(preserveArray = false) {
    const scenario = scenarioSelect.value;
    
    // אם preserveArray הוא true, אנחנו לא דורסים את המערך שכבר קיים בזיכרון
    if (!preserveArray) {
        currentArr = scenario === "true" ? [...generatedTrueArray] : [...generatedFalseArray];
    }
    
    limit1 = -1; 
    limit2 = currentArr.length - 1;
    sum = 0;
    forIndex = 0;
    phase = "for_loop";
    isFinished = false;
    
    resultDisplay.style.display = "none";
    logStream.innerHTML = "אתחול: מחשבים את סכום כל איברי המערך (מאינדקס 0 עד ל-limit2).";
    
    renderArray();
    updateStatus();
}

function renderArray() {
    arrayRow.innerHTML = "";
    pointersRow.innerHTML = "";
    
    const totalCells = currentArr.length;
    
    for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement("div");
        cell.className = "array-cell";
        cell.innerHTML = `<span class="number-display">${currentArr[i]}</span>`;
        
        if (phase === "for_loop") {
            if (i <= forIndex) {
                cell.classList.add("bg-yellow");
            }
        } else if (phase === "while_loop" || phase === "finished") {
            if (limit1 >= 0 && i <= limit1) {
                cell.classList.add("bg-red");
            } else if (i >= limit1 + 1 && i <= limit2) {
                cell.classList.add("bg-yellow");
            } else if (i >= limit2 + 1) {
                cell.classList.add("bg-green");
            }
        }
        
        arrayRow.appendChild(cell);
    }
    
    setTimeout(() => {
        const cells = document.querySelectorAll(".array-cell");
        if(cells.length === 0) return;
        
        const containerRect = arrayRow.getBoundingClientRect();
        
        const lbl1 = document.createElement("div");
        lbl1.className = "pointer-label limit1-label";
        lbl1.innerText = `limit1 (${limit1})`;
        if (limit1 === -1) {
            lbl1.style.left = `-40px`;
        } else {
            const l1Rect = cells[limit1].getBoundingClientRect();
            const l1Left = (l1Rect.left + l1Rect.width/2) - containerRect.left;
            lbl1.style.left = `${l1Left}px`;
        }
        pointersRow.appendChild(lbl1);
        
        const l2Rect = cells[limit2].getBoundingClientRect();
        const l2Left = (l2Rect.left + l2Rect.width/2) - containerRect.left;
        const lbl2 = document.createElement("div");
        lbl2.className = "pointer-label limit2-label";
        lbl2.innerText = `limit2 (${limit2})`;
        lbl2.style.left = `${l2Left}px`;
        pointersRow.appendChild(lbl2);
    }, 15);
}

function updateStatus() {
    valSum.innerHTML = sum;
    if (phase === "for_loop") {
        valPhase.innerText = `לולאת סכימה (i = ${forIndex})`;
    } else if (phase === "while_loop") {
        valPhase.innerText = "לולאת חיפוש (while)";
    } else {
        valPhase.innerText = "הסתיים";
    }
}

function nextStep() {
    if (isFinished) return;
    
    if (phase === "for_loop") {
        if (forIndex <= limit2) {
            sum += currentArr[forIndex];
            logStream.innerHTML = `מוסיפים את arr[${forIndex}] (${currentArr[forIndex]}) לסכום.`;
            
            if (forIndex === limit2) {
                phase = "while_loop";
                logStream.innerHTML += `<br><strong>מעבר ללולאת ה-while!</strong> ה-sum ההתחלתי מייצג את כל הטווח הצהוב: מ-0 עד 19.`;
                forIndex++;
                renderArray();
                updateStatus();
                return;
            }
            forIndex++;
            renderArray();
            updateStatus();
        }
        return;
    }
    
    if (phase === "while_loop") {
        if (sum === 0 && (limit2 - limit1 > 1)) {
            logStream.innerHTML = `נמצא סכום אפס בטווח הצהוב המכיל איברים! החזרת <strong>true</strong>.`;
            isFinished = true;
            phase = "finished";
            showResult(true);
            return;
        }

        if (limit1 >= limit2 - 1) {
            logStream.innerHTML = `הטווח הצהוב הצטמצם לרמה מינימלית ולא נמצא סכום 0. החזרת <strong>false</strong>.`;
            isFinished = true;
            phase = "finished";
            showResult(false);
            return;
        }

        if (sum < 0) {
            limit1++; 
            sum -= currentArr[limit1];
            logStream.innerHTML = `הסכום בטווח הצהוב שלילי (<span class='number-display'>${sum + currentArr[limit1]}</span>). מקדמים את limit1 ל-${limit1}. האיבר <span class='number-display'>${currentArr[limit1]}</span> נצבע באדום ונגרע מהסכום.`;
            renderArray();
            updateStatus();
        } else if (sum > 0) {
            sum -= currentArr[limit2]; 
            logStream.innerHTML = `הסכום בטווח הצהוב חיובי (<span class='number-display'>${sum + currentArr[limit2]}</span>). מחסירים את arr[limit2] (<span class='number-display'>${currentArr[limit2]}</span>) שהופך לירוק, ומקטינים את limit2 ל-${limit2-1}.`;
            limit2--;
            renderArray();
            updateStatus();
        }
        
        if (sum === 0 && (limit2 - limit1 > 1)) {
            logStream.innerHTML += `<br>נמצא סכום אפס בטווח הצהוב המכיל איברים! החזרת <strong>true</strong>.`;
            isFinished = true;
            phase = "finished";
            showResult(true);
        }
    }
}

function showResult(bool) {
    resultDisplay.style.display = "block";
    if (bool) {
        resultDisplay.className = "result-box result-true";
        resultDisplay.innerText = "תוצאת הריצה: true (נמצא הפיצול המבוקש)";
    } else {
        resultDisplay.className = "result-box result-false";
        resultDisplay.innerText = "תוצאת הריצה: false (לא קיימים אינדקסים כאלו)";
    }
    updateStatus();
}

document.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        event.preventDefault(); 
        nextStep();
    }
});

document.getElementById("btn-step").addEventListener("click", nextStep);

// כפתור הגרלה מחדש (מייצר מערכים חדשים)
document.getElementById("btn-reset").addEventListener("click", () => {
    generateScenarios(); 
    initSimulation(false);
});

// כפתור הרצה מחדש (שומר על המערך הקיים)
document.getElementById("btn-rerun").addEventListener("click", () => {
    initSimulation(true);
});

scenarioSelect.addEventListener("change", () => {
    initSimulation(false);
});

generateScenarios();
initSimulation(false);
</script>

</body>
</html>
