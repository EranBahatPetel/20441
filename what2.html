<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>האם יש במערך רצף שסכומו ערך נתון</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
        }

        .setup-container {
            margin-bottom: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type="number"] {
            width: 80px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            text-align: center;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .btn-back {
            background-color: #e67e22;
        }

        .btn-back:hover:not(:disabled) {
            background-color: #d35400;
        }

        .btn-reset {
            background-color: #9b59b6;
        }

        .btn-reset:hover:not(:disabled) {
            background-color: #8e44ad;
        }

        .btn-new {
            background-color: #7f8c8d;
        }

        .btn-new:hover:not(:disabled) {
            background-color: #636e72;
        }

        .array-container {
            display: flex;
            flex-direction: row;
            direction: ltr; 
            position: relative;
            margin-top: 40px;
            margin-bottom: 60px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .cell-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 50px;
            position: relative;
        }

        .cell {
            width: 40px;
            height: 40px;
            border: 2px solid #bdc3c7;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            background-color: #fff;
            transition: all 0.3s ease;
        }

        .cell.in-window {
            background-color: #e8f8f5;
            border-color: #2ecc71;
        }

        .index {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 4px;
        }

        .pointer {
            position: absolute;
            font-weight: bold;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 3px;
            color: white;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .pointer.l {
            background-color: #e74c3c;
            bottom: -30px;
        }

        .pointer.r {
            background-color: #2980b9;
            bottom: -55px;
        }

        .status-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .metric {
            font-size: 18px;
            margin: 10px 0;
            color: #34495e;
        }

        .metric span {
            font-weight: bold;
            color: #2c3e50;
        }

        .message {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
        }

        .failure {
            background-color: #f8d7da;
            color: #721c24;
        }

        .instruction-tip {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 15px;
            background: #eebd2b1a;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px dashed #f1c40f;
        }
    </style>
</head>
<body>

    <h1>האם יש במערך רצף שסכומו ערך נתון</h1>

    <!-- שלב א: הזנת ה-num המבוקש וכפתורי ניווט -->
    <div class="setup-container">
        <label for="targetNum">הכנס את ה-num המבוקש:</label>
        <input type="number" id="targetNum" min="1" value="50" onchange="resetSimulation()">
        <button id="stepForwardBtn" onclick="stepForward()">צעד קדימה</button>
        <button id="stepBackBtn" class="btn-back" onclick="stepBackward()" disabled>צעד אחורה</button>
        <button id="resetSearchBtn" class="btn-reset" onclick="resetSimulation()" disabled>אתחול חיפוש</button>
        <button class="btn-new" onclick="generateNewArray()">הגרל מערך חדש</button>
    </div>

    <!-- הנחיית שימוש -->
    <div class="instruction-tip" id="keyboardTip">
        ניתן להתקדם באמצעות הכפתור <strong>צעד קדימה</strong> או מקש <strong>Enter</strong>, לחזור באמצעות <strong>צעד אחורה</strong>, או לאפס בעזרת <strong>אתחול חיפוש</strong>.
    </div>

    <!-- תצוגת המערך והמצביעים -->
    <div class="array-container" id="arrayContainer"></div>

    <!-- פאנל נתונים ומצב הנוכחי -->
    <div class="status-panel" id="statusPanel" style="display: none;">
        <div class="metric">הסכום המבוקש (num): <span id="valNumBox">-</span></div>
        <div class="metric">הסכום הנוכחי (sum): <span id="valSum">-</span></div>
        <div class="metric">הסבר פעולה: <span id="valAction" style="font-weight: normal; color: #7f8c8d;">-</span></div>
        <div id="msgContainer" class="message" style="display: none;"></div>
    </div>

    <script>
        let array = [];
        const arraySize = 20;
        
        let l = 0;
        let r = 1;
        let currentSum = 0;
        let targetNum = 0;
        
        // מצבי הסימולציה: 'idle' (טרם התחיל), 'running' (בעיצומו), 'finished' (הסתיים)
        let simState = 'idle'; 
        let history = [];

        window.onload = function() {
            generateNewArray();
            
            // האזנה למקלדת
            window.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault(); 
                    stepForward();
                }
            });
        };

        function generateNewArray() {
            array = [];
            for (let i = 0; i < arraySize; i++) {
                array.push(Math.floor(Math.random() * 20) + 1);
            }
            resetSimulation();
        }

        function resetSimulation() {
            simState = 'idle';
            history = [];
            document.getElementById('statusPanel').style.display = 'none';
            document.getElementById('msgContainer').style.display = 'none';
            updateButtons();
            renderArray();
        }

        function updateButtons() {
            document.getElementById('stepForwardBtn').disabled = (simState === 'finished');
            document.getElementById('stepBackBtn').disabled = (history.length <= 1);
            document.getElementById('resetSearchBtn').disabled = (simState === 'idle');
        }

        function saveState(actionText, isFinished = false, isSuccess = false, finalMessage = "") {
            history.push({
                l: l,
                r: r,
                currentSum: currentSum,
                actionText: actionText,
                simState: simState,
                isSuccess: isSuccess,
                finalMessage: finalMessage
            });
            updateButtons();
        }

        function renderState(state) {
            l = state.l;
            r = state.r;
            currentSum = state.currentSum;
            simState = state.simState;

            document.getElementById('statusPanel').style.display = 'block';
            document.getElementById('valNumBox').innerText = targetNum;
            document.getElementById('valSum').innerText = currentSum;
            document.getElementById('valAction').innerText = state.actionText;

            const msgContainer = document.getElementById('msgContainer');
            if (simState === 'finished') {
                msgContainer.style.display = 'block';
                msgContainer.innerText = state.finalMessage;
                msgContainer.className = state.isSuccess ? "message success" : "message failure";
            } else {
                msgContainer.style.display = 'none';
            }

            updateButtons();
            renderArray();
        }

        function renderArray() {
            const container = document.getElementById('arrayContainer');
            container.innerHTML = '';

            // יצירת התאים משמאל לימין
            array.forEach((num, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'cell-wrapper';

                const indexDiv = document.createElement('div');
                indexDiv.className = 'index';
                indexDiv.innerText = index;

                const cellDiv = document.createElement('div');
                cellDiv.className = 'cell';
                cellDiv.id = `cell-${index}`;
                cellDiv.innerText = num;

                if (simState !== 'idle' && index >= l && index <= r - 1) {
                    cellDiv.classList.add('in-window');
                }

                wrapper.appendChild(indexDiv);
                wrapper.appendChild(cellDiv);
                container.appendChild(wrapper);
            });

            // תא קצה וירטואלי
            const extraWrapper = document.createElement('div');
            extraWrapper.className = 'cell-wrapper';
            extraWrapper.style.width = '50px';
            
            const extraIndex = document.createElement('div');
            extraIndex.className = 'index';
            extraIndex.innerText = arraySize;

            const extraCell = document.createElement('div');
            extraCell.className = 'cell';
            extraCell.style.border = '2px dashed #bdc3c7';
            extraCell.style.backgroundColor = '#fafafa';
            extraCell.innerText = 'קצה';

            extraWrapper.appendChild(extraIndex);
            extraWrapper.appendChild(extraCell);
            container.appendChild(extraWrapper);

            // מיקום המצביעים
            if (simState !== 'idle') {
                const lPointer = document.createElement('div');
                lPointer.className = 'pointer l';
                lPointer.innerText = 'l';
                lPointer.style.left = `${10 + (l * 50) + 12}px`;
                container.appendChild(lPointer);

                const rPointer = document.createElement('div');
                rPointer.className = 'pointer r';
                rPointer.innerText = 'r';
                rPointer.style.left = `${10 + (r * 50) + 12}px`;
                container.appendChild(rPointer);
            }
        }

        function stepForward() {
            if (simState === 'finished') return;

            // שלב האתחול (לחיצה ראשונה)
            if (simState === 'idle') {
                const inputVal = document.getElementById('targetNum').value;
                targetNum = parseInt(inputVal);

                if (isNaN(targetNum) || targetNum <= 0) {
                    alert("אנא הכנס מספר טבעי תקין הגדול מ-0");
                    return;
                }

                l = 0;
                r = 1;
                currentSum = array[0];
                simState = 'running';

                let initialAction = "החיפוש התחיל. המצביעים מאותחלים: l=0, r=1.";
                if (currentSum === targetNum) {
                    initialAction += " (הושג הסכום המבוקש מיד בהתחלה! לחץ צעד קדימה לסיום)";
                }

                saveState(initialAction);
                renderState(history[history.length - 1]);
                return;
            }

            // בדיקת התאמה ל-num
            if (currentSum === targetNum) {
                simState = 'finished';
                const msg = `נמצא רצף! מאינדקס ${l} עד אינדקס ${r-1} הסכום הוא בדיוק ${targetNum}.`;
                saveState("החיפוש הסתיים בהצלחה.", true, true, msg);
                renderState(history[history.length - 1]);
                return;
            }

            // בדיקת חריגה
            if (r > arraySize) {
                simState = 'finished';
                const msg = "החיפוש הסתיים בכישלון: המצביע r חרג מגבולות המערך ולא נמצא רצף מתאים.";
                saveState("החיפוש הסתיים בכישלון.", true, false, msg);
                renderState(history[history.length - 1]);
                return;
            }

            let actionDescription = "";

            // לוגיקת קידום המצביעים והסכום
            if (currentSum < targetNum) {
                if (r < arraySize) {
                    currentSum += array[r];
                }
                r++;
                actionDescription = `הסכום קטן מ-${targetNum} ➔ מצביע r זז ימינה.`;
            } 
            else if (currentSum > targetNum) {
                currentSum -= array[l];
                l++;
                actionDescription = `הסכום גדול מ-${targetNum} ➔ מצביע l זז ימינה.`;

                if (l === r) {
                    actionDescription += " l השיג את r ➔ מצביע r זז צעד ימינה.";
                    if (r < arraySize) {
                        currentSum += array[r];
                    }
                    r++;
                }
            }

            if (currentSum === targetNum) {
                actionDescription += " (הושג הסכום המבוקש! לחץ צעד קדימה לאישור)";
            } else if (r > arraySize && currentSum !== targetNum) {
                actionDescription += " (המצביע r חרג מהמערך. לחץ צעד קדימה לסיום)";
            }

            saveState(actionDescription);
            renderState(history[history.length - 1]);
        }

        function stepBackward() {
            if (history.length <= 1) return;
            
            // הסרת המצב הנוכחי ושחזור המצב הקודם
            history.pop();
            const previousState = history[history.length - 1];
            renderState(previousState);
        }
    </script>
</body>
</html>
