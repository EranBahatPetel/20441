<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>הדמיית אלגוריתם minAbsSum</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 40px;
            font-size: 14px;
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            border-right: 5px solid #3498db;
        }
        /* מערך בשורה אחת בודדת משמאל לימין */
        .array-container {
            display: flex;
            direction: ltr !important;
            justify-content: space-between;
            align-items: center;
            margin: 40px 0;
            position: relative;
            height: 120px;
            width: 100%;
            padding-top: 20px;
        }
        .array-box {
            flex: 1;
            min-width: 45px;
            max-width: 55px;
            height: 60px;
            border: 2px solid #bdc3c7;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 15px;
            position: relative;
            transition: all 0.3s ease;
            border-radius: 4px;
            margin: 0 2px;
        }
        .array-box .index {
            position: absolute;
            top: -25px;
            font-size: 11px;
            color: #7f8c8d;
            font-weight: normal;
        }
        .pointer {
            position: absolute;
            bottom: -32px;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            transition: all 0.3s ease;
            text-align: center;
            z-index: 10;
        }
        .pointer-low { background-color: #e67e22; left: 0; }
        .pointer-high { background-color: #9b59b6; right: 0; }
        .pointer-mid { background-color: #e74c3c; left: 50%; transform: translateX(-50%); }

        .box-mid-found { background-color: #fadbd8; border-color: #e74c3c; transform: scale(1.05); }
        .box-checked { background-color: #d4efdf; border-color: #2ecc71; }
        .box-eliminated { opacity: 0.35; background-color: #eaeded; }

        /* הדגשת זוג הזהב בסיום הריצה */
        .box-final-pair { 
            background-color: #fff9db !important; 
            border-color: #f59f00 !important; 
            color: #f59f00 !important;
            transform: scale(1.15); 
            box-shadow: 0 0 15px rgba(245, 159, 0, 0.6);
            z-index: 12;
        }

        .status-box {
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 6px;
            font-size: 18px;
            line-height: 1.6;
            min-height: 70px;
            border-right: 5px solid #2c3e50;
        }
        .math-expr {
            direction: ltr;
            display: inline-block;
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>הדמיית אלגוריתם <span class="math-expr">minAbsSum</span></h1>
    <div class="subtitle">לחץ על מקש <b>Enter</b> במקלדת כדי להתקדם בשלבי הריצה. לחיצה על <b>Backspace</b> תחזיר שלב אחד לאחור.</div>
    
    <div class="section">
        <strong>מערך הקלט (מוצג בשורה אחת משמאל לימין):</strong>
        <div class="array-container" id="arrayContainer"></div>
    </div>

    <div class="section">
        <strong>סטטוס והסבר מהלך האלגוריתם:</strong>
        <div class="status-box" id="statusBox">לחץ על מקש <b>Enter</b> כדי להתחיל בהדמיית האלגוריתם.</div>
    </div>
</div>

<script>
    let arrayData = [];
    let steps = [];
    let currentStep = 0;
    let finalTargetPair = [];

    function generateRandomSortedArray() {
        let arr = [];
        let numNeg = Math.floor(Math.random() * 9) + 4; 
        
        for (let i = 0; i < numNeg; i++) {
            let val = Math.floor(Math.random() * -45) - 2; 
            if (!arr.includes(val)) arr.push(val);
            else i--; 
        }
        arr.sort((a,b)=>a-b);

        let posArr = [];
        for (let i = numNeg; i < 20; i++) {
            let val = Math.floor(Math.random() * 50) + 1; 
            if (!posArr.includes(val) && !arr.includes(val)) posArr.push(val);
            else i--;
        }
        posArr.sort((a,b)=>a-b);
        
        return arr.concat(posArr);
    }

    function buildDynamicSteps(a) {
        let dynamicSteps = [];
        let eliminated = [];
        let idx = -1;

        dynamicSteps.push({
            status: "מתחילים את הפונקציה הראשית <span class='math-expr'>minAbsSum</span>. נקרא לתת-השיטה <span class='math-expr'>findSmallestAbsoluteNumberLocation</span> כדי למצוא את המיקום של המספר הקרוב ביותר ל-0 בערכו המוחלט. לחץ על <b>Enter</b> כדי להמשיך.",
            low: null, high: null, mid: null, highlight: [], eliminated: [...eliminated], isFinalStep: false
        });

        dynamicSteps.push({
            status: `בודקים תנאי קצה ראשוני במערך: האם <span class='math-expr'>a[0] > 0</span>? (${a[0]} > 0) &rarr; <b>${a[0] > 0}</b>.`,
            low: null, high: null, mid: null, highlight: [0], eliminated: [...eliminated], isFinalStep: false
        });
        if (a[0] > 0) idx = 0;

        if (idx === -1) {
            dynamicSteps.push({
                status: `בודקים תנאי קצה שני: האם <span class='math-expr'>a[1] > 0</span>? (${a[1]} > 0) &rarr; <b>${a[1] > 0}</b>.`,
                low: null, high: null, mid: null, highlight: [1], eliminated: [...eliminated], isFinalStep: false
            });
            if (a[1] > 0) idx = 1;
        }

        if (idx === -1) {
            let len = a.length;
            dynamicSteps.push({
                status: `בודקים תנאי קצה לסוף המערך: האם <span class='math-expr'>a[a.length - 1] < 0</span>? (${a[len-1]} < 0) &rarr; <b>${a[len-1] < 0}</b>.`,
                low: null, high: null, mid: null, highlight: [len-1], eliminated: [...eliminated], isFinalStep: false
            });
            if (a[len-1] < 0) idx = len - 1;
        }

        if (idx === -1) {
            let len = a.length;
            dynamicSteps.push({
                status: `בודקים תנאי קצה אחד לפני הסוף: האם <span class='math-expr'>a[a.length - 2] < 0</span>? (${a[len-2]} < 0) &rarr; <b>${a[len-2] < 0}</b>.`,
                low: null, high: null, mid: null, highlight: [len-2], eliminated: [...eliminated], isFinalStep: false
            });
            if (a[len-2] < 0) idx = len - 2;
        }

        if (idx === -1) {
            let low = 0, high = a.length - 1, mid = -1;
            dynamicSteps.push({
                status: `מאתחלים משתני חיפוש בינארי על המערך המעורב: <span class='math-expr'>low = 0</span>, <span class='math-expr'>high = ${high}</span>.`,
                low: low, high: high, mid: null, highlight: [], eliminated: [...eliminated], isFinalStep: false
            });

            while (low <= high) {
                dynamicSteps.push({
                    status: `לולאת ה-while רצה: תנאי הלולאה מתקיים מכיוון ש-<span class='math-expr'>low &le; high</span> (${low} &le; ${high}).`,
                    low: low, high: high, mid: mid >= 0 ? mid : null, highlight: [], eliminated: [...eliminated], isFinalStep: false
                });

                mid = Math.floor((low + high) / 2);
                dynamicSteps.push({
                    status: `מחשבים את אינדקס האמצע: <span class='math-expr'>mid = (${low} + ${high}) / 2 = ${mid}</span>. האיבר שנבחר הוא <span class='math-expr'>a[${mid}] = ${a[mid]}</span>.`,
                    low: low, high: high, mid: mid, highlight: [mid], eliminated: [...eliminated], isFinalStep: false
                });

                let valMid = Math.abs(a[mid]);
                let valPrev = mid - 1 >= 0 ? Math.abs(a[mid - 1]) : null;
                let valNext = mid + 1 < a.length ? Math.abs(a[mid + 1]) : null;

                let isMidSmallest = true;
                if (valPrev !== null && valMid > valPrev) isMidSmallest = false;
                if (valNext !== null && valMid > valNext) isMidSmallest = false;

                let statusMsg = `בודקים האם <span class='math-expr'>|a[mid]| &le;</span> שכניו: <span class='math-expr'>|a[${mid}]| = ${valMid}</span>. `;
                if (mid === 0) {
                    statusMsg += `<br><span style="color:red;">⚠️ חריגת גבולות מערך בקוד הנתון (גישה ל-a[-1]). ממשיכים רעיונית בניתוח הלוגי.</span>`;
                } else {
                    statusMsg += `השכנים הם <span class='math-expr'>|a[${mid-1}]| = ${valPrev}</span> ו-<span class='math-expr'>|a[${mid+1}]| = ${valNext}</span>.`;
                }

                dynamicSteps.push({
                    status: statusMsg,
                    low: low, high: high, mid: mid,
                    highlight: [mid, mid-1, mid+1].filter(i => i >= 0 && i < a.length),
                    eliminated: [...eliminated], isFinalStep: false
                });

                if (isMidSmallest || mid === 0) {
                    idx = mid;
                    dynamicSteps.push({
                        status: `נמצא האיבר בעל הערך המוחלט המינימלי! מחזירים את האינדקס <span class='math-expr'>mid = ${mid}</span>.`,
                        low: low, high: high, mid: mid, highlight: [mid], eliminated: [...eliminated], isFinalStep: false
                    });
                    break;
                }

                if (a[mid] > 0) {
                    for (let i = mid; i <= high; i++) { if (!eliminated.includes(i)) eliminated.push(i); }
                    high = mid - 1;
                    dynamicSteps.push({
                        status: `מאחר ו-<span class='math-expr'>a[${mid}] = ${a[mid]} > 0</span>, כל האיברים מימינו חיוביים וגדולים ממנו. נצמצם שמאלה: <span class='math-expr'>high = mid - 1 = ${high}</span>.`,
                        low: low, high: high, mid: mid, highlight: [], eliminated: [...eliminated], isFinalStep: false
                    });
                } else {
                    for (let i = low; i <= mid; i++) { if (!eliminated.includes(i)) eliminated.push(i); }
                    low = mid + 1;
                    dynamicSteps.push({
                        status: `מאחר ו-<span class='math-expr'>a[${mid}] = ${a[mid]} &le; 0</span>, נצמצם את טווח החיפוש ימינה: <span class='math-expr'>low = mid + 1 = ${low}</span>.`,
                        low: low, high: high, mid: mid, highlight: [], eliminated: [...eliminated], isFinalStep: false
                    });
                }
            }
        }

        dynamicSteps.push({
            status: `חזרנו לפונקציה הראשית. המיקום שהתקבל הוא: <span class='math-expr'>smallestPositiveNumberLocation = ${idx}</span> (ערכו: ${a[idx]}).`,
            low: null, high: null, mid: idx, highlight: [idx], eliminated: [], isFinalStep: false
        });

        if (idx === 0) {
            finalTargetPair = [0, 1];
            let res = a[0] + a[1];
            dynamicSteps.push({
                status: `<b>סיום הריצה!</b> תנאי <span class='math-expr'>location == 0</span> מתקיים. הפונקציה מחזירה <span class='math-expr'>a[0] + a[1] = ${res}</span>. זוג האיברים מודגש בזהב.`,
                low: null, high: null, mid: idx, highlight: [0, 1], eliminated: [], isFinalStep: true
            });
        } else if (idx === 1) {
            let abs0 = Math.abs(a[0]);
            let abs2 = Math.abs(a[2]);
            finalTargetPair = abs0 < abs2 ? [0, 1] : [1, 2];
            let res = Math.abs(a[1]) + Math.min(abs0, abs2);
            dynamicSteps.push({
                status: `<b>סיום הריצה!</b> תנאי <span class='math-expr'>location == 1</span> מתקיים. התוצאה המוחזרת היא: <span class='math-expr'>${res}</span>. זוג האיברים מודגש בזהב.`,
                low: null, high: null, mid: idx, highlight: [0, 1, 2], eliminated: [], isFinalStep: true
            });
        } else if (idx === a.length - 1) {
            finalTargetPair = [idx - 1, idx];
            let res = Math.abs(a[idx]) + Math.abs(a[idx - 1]);
            dynamicSteps.push({
                status: `<b>סיום הריצה!</b> תנאי קצה של אינדקס אחרון מתקיים. התוצאה המוחזרת היא: <span class='math-expr'>${res}</span>. זוג האיברים מודגש בזהב.`,
                low: null, high: null, mid: idx, highlight: [idx - 1, idx], eliminated: [], isFinalStep: true
            });
        } else if (idx === a.length - 2) {
            let absPrev = Math.abs(a[idx - 1]);
            let absNext = Math.abs(a[idx + 1]);
            finalTargetPair = absPrev < absNext ? [idx - 1, idx] : [idx, idx + 1];
            let res = Math.abs(a[idx]) + Math.min(absNext, absPrev);
            dynamicSteps.push({
                status: `<b>סיום הריצה!</b> תנאי קצה אחד לפני האחרון מתקיים. התוצאה המוחזרת היא: <span class='math-expr'>${res}</span>. זוג האיברים מודגש בזהב.`,
                low: null, high: null, mid: idx, highlight: [idx - 1, idx, idx + 1], eliminated: [], isFinalStep: true
            });
        } else {
            let opt2 = Math.abs(a[idx - 1]) + Math.abs(a[idx]);
            let opt3 = Math.abs(a[idx]) + Math.abs(a[idx + 1]);
            let opt1 = Math.abs(a[idx - 2]) + Math.abs(a[idx - 1]);
            let finalRes = Math.min(opt1, Math.min(opt2, opt3));

            if (finalRes === opt1) finalTargetPair = [idx - 2, idx - 1];
            else if (finalRes === opt2) finalTargetPair = [idx - 1, idx];
            else finalTargetPair = [idx, idx + 1];

            dynamicSteps.push({
                status: `האלגוריתם בוחן את 3 האפשרויות הזוגיות סביב נקודת המעבר: <br> option1 (שני השכנים משמאל): ${opt1} | option2 (שלילי וחיובי צמודים): ${opt2} | option3 (שני החיוביים מימין): ${opt3}`,
                low: null, high: null, mid: idx, highlight: [idx-2, idx-1, idx, idx+1], eliminated: [], isFinalStep: false
            });

            dynamicSteps.push({
                status: `<b>סיום הריצה!</b> הערך המינימלי שנבחר מבין שלוש האופציות הוא <span class='math-expr'>${finalRes}</span>. זוג האיברים שיוצר סכום זה מודגש במערך בצבע זהב.`,
                low: null, high: null, mid: idx, highlight: [], eliminated: [], isFinalStep: true
            });
        }

        return dynamicSteps;
    }

    function renderArray() {
        const container = document.getElementById('arrayContainer');
        container.innerHTML = '';
        const stepData = steps[currentStep];

        arrayData.forEach((val, idx) => {
            const box = document.createElement('div');
            box.className = 'array-box';
            box.innerHTML = `<span class="index">${idx}</span>${val}`;

            if (stepData.isFinalStep && finalTargetPair.includes(idx)) {
                box.classList.add('box-final-pair');
            } else {
                if (stepData.mid === idx) {
                    box.classList.add('box-mid-found');
                } else if (stepData.highlight.includes(idx)) {
                    box.classList.add('box-checked');
                } else if (stepData.eliminated.includes(idx)) {
                    box.classList.add('box-eliminated');
                }
            }

            if (stepData.low === idx) {
                const ptr = document.createElement('div');
                ptr.className = 'pointer pointer-low';
                ptr.innerText = 'low';
                box.appendChild(ptr);
            }
            if (stepData.high === idx) {
                const ptr = document.createElement('div');
                ptr.className = 'pointer pointer-high';
                ptr.innerText = 'high';
                box.appendChild(ptr);
            }
            if (stepData.mid === idx && stepData.low !== null) {
                const ptr = document.createElement('div');
                ptr.className = 'pointer pointer-mid';
                ptr.innerText = 'mid';
                box.appendChild(ptr);
            }

            container.appendChild(box);
        });

        document.getElementById('statusBox').innerHTML = stepData.status;
    }

    // האזנה למקשי המקלדת
    window.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            if (currentStep < steps.length - 1) {
                currentStep++;
                renderArray();
            }
        } else if (event.key === 'Backspace') {
            if (currentStep > 0) {
                currentStep--;
                renderArray();
            }
            event.preventDefault(); 
        }
    });

    function initPageRun() {
        arrayData = generateRandomSortedArray();
        steps = buildDynamicSteps(arrayData);
        currentStep = 0;
        renderArray();
    }

    initPageRun();
</script>

</body>
</html>
